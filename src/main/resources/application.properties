spring.application.name=internetprovidermanagement

# --- Database Connection ---
# These values will be supplied by environment variables
# (e.g., from your .env file when using Docker Compose, or Cloud Run service configuration)

# You can define defaults here if you want, but it's often cleaner to set them purely from the environment.
# Example: DB_HOST_ENV=${DB_HOST_ENV:lu-senior-project-database-mohammadfakih025-916d.l.aivencloud.com}
# For now, we'll assume they are always provided.

DB_HOST=${DB_HOST_ENV}
DB_PORT=${DB_PORT_ENV}
DB_NAME=${DB_NAME_ENV}
DB_USERNAME=${DB_USERNAME_ENV}
DB_PASSWORD=${DB_PASSWORD_ENV}
DB_KEYSTORE_PASSWORD=${DB_KEYSTORE_PASSWORD_ENV}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=classpath:certs/aiven_truststore.jks&trustCertificateKeyStorePassword=${DB_KEYSTORE_PASSWORD}&trustCertificateKeyStoreType=JKS
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hikari Connection Pool ---
# These can also be environment variables if they need to change per environment
# For example: spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=2000

# --- JPA & Hibernate ---
spring.jpa.hibernate.ddl-auto=none # Good practice for production (use Flyway)
spring.jpa.show-sql=true # Consider true for dev, false for prod (or use logging levels)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Flyway Database Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true # Usually good, can be false if you have out-of-band schema changes

# --- Custom Application Properties ---
# This can also be externalized if needed: payment.cleanup.cron=${PAYMENT_CLEANUP_CRON_ENV:0 0 0 * * *}
payment.cleanup.cron=0 0 0 * * *