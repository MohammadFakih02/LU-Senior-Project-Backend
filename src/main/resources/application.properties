spring.application.name=internetprovidermanagement

DB_HOST=${DB_HOST_ENV}
DB_PORT=${DB_PORT_ENV}
DB_NAME=${DB_NAME_ENV}
DB_USERNAME=${DB_USERNAME_ENV}
DB_PASSWORD=${DB_PASSWORD_ENV}
DB_KEYSTORE_PASSWORD=${DB_KEYSTORE_PASSWORD_ENV}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=classpath:certs/aiven_truststore.jks&trustCertificateKeyStorePassword=${DB_KEYSTORE_PASSWORD}&trustCertificateKeyStoreType=JKS
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=2000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

payment.cleanup.cron=0 0 0 * * *

#!server.forward-headers-strategy=NATIVE
#!server.servlet.session.cookie.same-site=None